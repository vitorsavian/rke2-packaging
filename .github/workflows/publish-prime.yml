name: Publish Prime
on:
  push:
    tags:
      - 'v*+rke2r*.latest.[0-9]*'
      - 'v*+rke2r*.stable.[0-9]*'
      - 'v*+rke2r*.testing.[0-9]*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ contains(github.ref_name, '.latest.') || contains(github.ref_name, '.stable.') }}
    uses: ./.github/workflows/publish-rpm.yml
    with:
      tag: ${{ github.ref_name }}
      repository: prime
      release-assets: false
    secrets: inherit

  testing:
    if: ${{ contains(github.ref_name, '.testing.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Testing publication placeholder
        run: echo "Testing asset source is not configured; skipping RPM build and publication."